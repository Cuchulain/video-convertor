# Video convertor pro TV – Jan Čejka, https://dev.jancejka.cz
# https://github.com/Cuchulain/video-convertor (licence MIT)
#
# Profily cílových zařízení (televizorů). Čte je convert-for-tv.sh i Windows
# verze (VideoTools.ps1). Vlastní profily patří do uživatelského souboru
# devices.conf (viz README); profil se stejným názvem nahradí vestavěný.
#
# [nazev]           malá písmena, číslice, - a _; výstup jde do složky tv-<nazev>
# description       popis do výpisu --list-devices
# audio_codec       kodek při překódování zvuku: ac3 | aac (profil hd10 vždy aac)
# audio_kbps        nejvyšší bitrate překódovaného zvuku (kbps, omezí se zdrojem)
# audio_copy        kodeky zvuku, které se mohou zkopírovat (stereo, <= 48 kHz, <= 384 kbps)
# h264_max_level    nejvyšší level H.264 pro kopii videa (41 = 4.1); prázdné = bez omezení
# max_width         nejvyšší šířka obrazu
# max_height        nejvyšší výška obrazu
# video_kbps_percent  datový tok videa v % hodnot profilů kvality (standard
#                   2000, akcni 2500, serialy 1600 kb/s jsou pro 1280x720);
#                   pro 1920x1080 přibližně 180
# blue_percent      modrá složka obrazu v % (0-100, 100 = beze změny); nižší
#                   hodnota vyrovná TV, která svítí do modra (opotřebované LED).
#                   Video se pak vždy překóduje.
#
# Chybějící klíč má výchozí hodnotu podle profilu hyundai.

[hyundai]
description = Televizor Hyundai (původní nastavení)
audio_codec = ac3
audio_kbps = 384
audio_copy = ac3 mp3
h264_max_level =
max_width = 1280
max_height = 720
video_kbps_percent = 100
blue_percent = 100

[lg]
# LG webOS 3.0 (2016, Full HD 1920x1080, převádí se v plném rozlišení s 1,8x
# vyšším datovým tokem). Podle specifikace LG přehraje v MP4
# H.264 do High@4.2 a zvuk Dolby Digital (AC3), DD+, AAC i MP3; AC3 v MP4
# ověřeno na TV. Rozkolísané časové značky (video z MKV) odmítne, ty se ale
# srovnávají pro všechna zařízení (viz decide_timestamps v convert-for-tv.sh).
# Opotřebované LED podsvícení svítí do modra -> modrá složka na 50 %
# (podle blue_reducer.py, výchozí hodnota posuvníku).
description = LG 49LH6047 (webOS 3.0, 2016)
audio_codec = ac3
audio_kbps = 384
audio_copy = ac3 aac mp3
h264_max_level = 42
max_width = 1920
max_height = 1080
video_kbps_percent = 180
blue_percent = 50
